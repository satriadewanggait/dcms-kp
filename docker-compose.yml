services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dcms
      POSTGRES_PASSWORD: dcms_secret
      POSTGRES_DB: dcms_kp
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcms -d dcms_kp"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://dcms:dcms_secret@db:5432/dcms_kp
      NODE_ENV: development
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
